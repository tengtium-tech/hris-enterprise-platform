name: Main Pipeline

# Runs on every push to main -- a separate workflow file from the PR Pipeline so
# each has its own clear status-check identity for branch protection.
#
# The Development deployment step below is intentionally automatic and
# unattended: a broken deployment to a throwaway Development environment costs
# nothing beyond re-running the pipeline, so gating it on manual approval would
# only slow feedback without reducing risk. Staging and Production promotion are
# NOT implemented in this file -- both need real infrastructure (a deployment
# target, tenant payroll calendar data for Production's payroll-window-aware
# approval gate) that doesn't exist yet. Implement those stages once that
# infrastructure exists; don't stub them out with a fake approval step now.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Every commit that reaches main has already passed the PR Pipeline once,
      # against the pre-merge branch tip. This re-runs the same checks against
      # the actual commit on main, because a squash merge can combine two
      # individually passing branches into a combination that was never itself
      # tested.
      - name: Restore dependencies (NuGet)
        working-directory: backend
        run: dotnet restore Hris.sln

      - name: Build (backend)
        working-directory: backend
        run: dotnet build Hris.sln --no-restore --configuration Release

      - name: Static analysis — dotnet format
        working-directory: backend
        run: dotnet format Hris.sln --verify-no-changes --no-restore

      - name: Test suite
        working-directory: backend
        run: dotnet test Hris.sln --no-build --configuration Release --logger "trx"

      # One backend image, multi-stage build, tagged with the Git commit SHA --
      # never `latest` as the deployment reference, so a running container can
      # always be traced back to the exact commit it was built from.
      - name: Build container image (backend)
        working-directory: backend
        run: docker build -t hris-api:${{ github.sha }} -f Dockerfile .

      # Scans the image built above and fails the job on a CRITICAL finding,
      # before the push step below ever runs -- an image with a critical
      # vulnerability must not reach the registry, let alone a real environment.
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: hris-api:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for registry
        run: docker tag hris-api:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/hris-api:${{ github.sha }}

      - name: Push image to GitHub Container Registry
        run: docker push ghcr.io/${{ github.repository_owner }}/hris-api:${{ github.sha }}

      # OpenAPI is meant to be generated from the implementation, not hand
      # maintained, via Swashbuckle. Left as a placeholder until Hris.Api exposes
      # at least one endpoint beyond the health checks -- there's nothing to
      # generate a meaningful spec from yet.
      - name: Generate OpenAPI specification
        working-directory: backend
        run: echo "dotnet run --project src/Api -- --generate-openapi (or equivalent Swashbuckle CLI invocation) runs here once Hris.Api exposes at least one endpoint beyond the health checks."

      # TODO(once a Development deployment target exists): implement the actual
      # deployment step. Migrations must be applied before this step once a real
      # EF Core model and a real target both exist -- don't reorder that.
      - name: Deploy to Development (placeholder — no deployment target yet)
        run: echo "Automatic deployment to Development runs here once a Development target exists. Order -- migrations, then application deployment, then /health/ready verification."
