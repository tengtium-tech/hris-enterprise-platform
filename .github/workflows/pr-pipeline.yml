name: PR Pipeline

# Runs on every pull request targeting main. A separate workflow file from the
# Main Pipeline (which runs on push to main), so branch protection's required
# status check configuration stays simple and unambiguous -- one job name per
# trigger, not two triggers sharing one workflow.
#
# All stages must complete within 15 minutes (job-level timeout below enforces
# this). Any failing stage fails the build -- there is no category of test that
# may fail without blocking a merge.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # TODO(once frontend/ exists, its own later development phase): add a
      # corresponding Node/npm setup + build step. Only the backend half of the
      # solution is buildable today.
      - name: Restore dependencies (NuGet)
        working-directory: backend
        run: dotnet restore Hris.sln

      - name: Build (backend)
        working-directory: backend
        run: dotnet build Hris.sln --no-restore --configuration Release

      # Formatting violations fail dotnet format --verify-no-changes in CI.
      # Roslyn analyzers are configured as build errors via Directory.Build.props
      # (TreatWarningsAsErrors), so a failing analyzer already fails the Build
      # step above; this step catches formatting specifically.
      - name: Static analysis — dotnet format
        working-directory: backend
        run: dotnet format Hris.sln --verify-no-changes --no-restore

      # TODO(once a module needs it): add the custom Roslyn analyzer that
      # enforces "no role-name string comparison in business logic" as a static
      # analysis rule, not code review alone.

      # dotnet test runs whatever test classes exist; today that's only
      # Hris.CriticalRequirements.Tests' Skip-marked stubs, which report as
      # skipped, not passed -- a green run here means "no regression," not "the
      # Critical Test Requirements are satisfied." That distinction stays true
      # until each stub is implemented alongside its own module/framework.
      - name: Test suite
        working-directory: backend
        run: dotnet test Hris.sln --no-build --configuration Release --logger "trx"

      # A PR that changes the EF Core model should run a migration dry-run
      # (dotnet ef migrations script, generated and inspected for destructive
      # operations) before it can merge. No EF Core model exists yet -- this
      # step is a placeholder until one does; implement it when the first
      # DbContext is added, don't remove it in the meantime.
      - name: Migration dry-run (placeholder — no EF Core model exists yet)
        working-directory: backend
        run: echo "No EF Core model yet. Once one exists, this step generates a migration script and fails the check on an unacknowledged destructive operation."
